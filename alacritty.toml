[general]
import = [
    "~/.config/alacritty/themes/tokyo_night_storm.toml"
    ]
[window]
padding = { x = 8, y = 8 }
decorations = "full"
opacity=0.8

[font]
normal = { family = "JetBrains Mono NF", style = "Regular" }
bold = { family = "JetBrains Mono NF", style = "Bold" }
italic = { family = "JetBrains Mono NF", style = "Italic" }
size = 12.0

[cursor]
style = { shape = "Block", blinking = "On" }
